name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install development dependencies
        run: pip install ".[dev]"
      - name: Run tests with coverage
        run: pytest --cov=src --cov-report=xml
      - name: Verify coverage threshold
        run: |
          coverage xml
          python -c "import sys, json; data=json.load(open('coverage.json')); sys.exit(0 if data['totals']['covered_percent']>=80 else 1)"
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff lint
        run: ruff check --format=github src tests